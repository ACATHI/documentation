<!DOCTYPE html>
<html lang="ca" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>ACATHI — Consentiment RGPD</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --purple: #5B2D8E;
      --purple-light: #f3eeff;
      --green: #1E7A4A;
      --red: #c0392b;
      --border: #ddd;
      --text: #222;
      --muted: #666;
      --bg: #fff;
      --section-bg: #fafafa;
    }
    html, body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); font-size: 16px; }
    body { padding-bottom: 60px; }

    .lang-bar {
      background: var(--purple);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .lang-btn {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .lang-btn:hover, .lang-btn.active { background: rgba(255,255,255,0.35); }

    header {
      background: var(--purple);
      color: #fff;
      padding: 20px 16px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
    header p { margin: 0; font-size: 13px; opacity: .85; }

    .container { max-width: 640px; margin: 0 auto; padding: 0 16px; }

    .section {
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
    }
    .section h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--purple);
    }

    label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
    input[type="text"], input[type="email"], input[type="date"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
      background: #fff;
      color: var(--text);
      margin-bottom: 14px;
      -webkit-appearance: none;
    }
    input:focus { outline: 2px solid var(--purple); border-color: var(--purple); }

    .consent-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .consent-item:last-child { border-bottom: none; }
    .consent-item input[type="checkbox"] {
      width: 22px; height: 22px;
      flex-shrink: 0;
      margin-top: 2px;
      accent-color: var(--purple);
      cursor: pointer;
    }
    .consent-label { font-size: 15px; line-height: 1.4; }
    .consent-label strong { display: block; margin-bottom: 2px; }
    .consent-label small { color: var(--muted); font-size: 13px; }
    .required-badge {
      background: #fee;
      color: var(--red);
      border-radius: 3px;
      font-size: 11px;
      padding: 1px 5px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Signature pad */
    .sig-container {
      border: 2px dashed var(--border);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      touch-action: none;
      position: relative;
    }
    .sig-container canvas { display: block; width: 100%; height: 200px; cursor: crosshair; }
    .sig-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ccc;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }
    .sig-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn-clear {
      background: #fff;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-clear:hover { background: #f5f5f5; }

    .btn-submit {
      display: block;
      width: 100%;
      max-width: 640px;
      margin: 20px auto 0;
      padding: 16px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-submit:hover { background: #166038; }
    .btn-submit:disabled { background: #aaa; cursor: not-allowed; }

    .error-msg {
      background: #fee;
      color: var(--red);
      border: 1px solid #f5c6c6;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      margin: 12px 0;
      display: none;
    }

    /* Status screens */
    #status-screen {
      display: none;
      text-align: center;
      padding: 60px 20px;
      max-width: 480px;
      margin: 0 auto;
    }
    #status-screen .icon { font-size: 64px; margin-bottom: 16px; }
    #status-screen h2 { color: var(--green); margin-bottom: 8px; }
    #status-screen p { color: var(--muted); font-size: 15px; }

    /* RTL */
    [dir="rtl"] .consent-item { flex-direction: row-reverse; }
    [dir="rtl"] .required-badge { margin-left: 0; margin-right: 6px; }
    [dir="rtl"] label, [dir="rtl"] .consent-label { text-align: right; }
    [dir="rtl"] input[type="text"],
    [dir="rtl"] input[type="email"],
    [dir="rtl"] input[type="date"] { direction: rtl; }

    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1a2e; --section-bg: #16213e; --text: #eee; --muted: #aaa; --border: #333; }
      input[type="text"], input[type="email"], input[type="date"] { background: #0f3460; color: #eee; border-color: #444; }
      .sig-container { background: #0f3460; }
    }
  </style>
</head>
<body>

<div class="lang-bar" id="lang-bar" role="navigation" aria-label="Language selector">
  <button class="lang-btn active" data-lang="ca">CA</button>
  <button class="lang-btn" data-lang="es">ES</button>
  <button class="lang-btn" data-lang="fr">FR</button>
  <button class="lang-btn" data-lang="en">EN</button>
  <button class="lang-btn" data-lang="ar">AR</button>
  <button class="lang-btn" data-lang="ru">RU</button>
  <button class="lang-btn" data-lang="uk">UK</button>
</div>

<header>
  <h1 id="hdr-title"></h1>
  <p id="hdr-org"></p>
</header>

<div class="container" id="form-container">

  <div class="section">
    <h2 id="sec-personal"></h2>
    <label for="firstName" id="lbl-firstname"></label>
    <input type="text" id="firstName" autocomplete="given-name" required/>
    <label for="lastName" id="lbl-lastname"></label>
    <input type="text" id="lastName" autocomplete="family-name" required/>
    <label for="docNum" id="lbl-doc"></label>
    <input type="text" id="docNum" placeholder="NIE / Passport / —" autocomplete="off"/>
    <label for="dob" id="lbl-dob"></label>
    <input type="date" id="dob"/>
    <label for="email" id="lbl-email"></label>
    <input type="email" id="email" autocomplete="email"/>
    <label for="place" id="lbl-place"></label>
    <input type="text" id="place" value="Barcelona"/>
  </div>

  <div class="section">
    <h2 id="sec-consents"></h2>
    <div class="consent-item">
      <input type="checkbox" id="cb-basic" required/>
      <div class="consent-label">
        <strong id="cat-basic-label"></strong>
        <small id="cat-basic-desc"></small>
        <span class="required-badge" id="lbl-required"></span>
      </div>
    </div>
    <div class="consent-item">
      <input type="checkbox" id="cb-legal"/>
      <div class="consent-label">
        <strong id="cat-legal-label"></strong>
        <small id="cat-legal-desc"></small>
      </div>
    </div>
    <div class="consent-item">
      <input type="checkbox" id="cb-identity"/>
      <div class="consent-label">
        <strong id="cat-identity-label"></strong>
        <small id="cat-identity-desc"></small>
      </div>
    </div>
    <div class="consent-item">
      <input type="checkbox" id="cb-health"/>
      <div class="consent-label">
        <strong id="cat-health-label"></strong>
        <small id="cat-health-desc"></small>
      </div>
    </div>
    <div class="consent-item">
      <input type="checkbox" id="cb-economic"/>
      <div class="consent-label">
        <strong id="cat-economic-label"></strong>
        <small id="cat-economic-desc"></small>
      </div>
    </div>
    <div class="consent-item">
      <input type="checkbox" id="cb-risk"/>
      <div class="consent-label">
        <strong id="cat-risk-label"></strong>
        <small id="cat-risk-desc"></small>
      </div>
    </div>
  </div>

  <div class="section">
    <h2 id="sec-signature"></h2>
    <p id="sig-instruction" style="font-size:14px;color:var(--muted);margin-bottom:12px;"></p>
    <div class="sig-container" id="sig-container">
      <canvas id="sig-canvas"></canvas>
      <div class="sig-hint" id="sig-hint"></div>
    </div>
    <div class="sig-actions">
      <button class="btn-clear" id="btn-clear" type="button"></button>
    </div>
  </div>

  <div class="section" style="background:var(--purple-light); border-color:#d4c4eb;">
    <h2 id="sec-legal"></h2>
    <p id="legal-text" style="font-size:13px;color:var(--muted);margin:0;"></p>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <button class="btn-submit" id="btn-submit" type="button"></button>
</div>

<!-- Success / error screens -->
<div id="status-screen">
  <div class="icon" id="status-icon"></div>
  <h2 id="status-title"></h2>
  <p id="status-msg"></p>
</div>

// ── Signature pad ─────────────────────────────────────────────────────────
var canvas = document.getElementById('sig-canvas');
var ctx = canvas.getContext('2d');
var drawing = false;
var sigEmpty = true;
var hint = document.getElementById('sig-hint');

function resizeCanvas() {
  var rect = canvas.parentElement.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  var w = rect.width;
  var h = 200;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function getPos(e) {
  var r = canvas.getBoundingClientRect();
  var src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - r.left, y: src.clientY - r.top };
}
function startDraw(e) { e.preventDefault(); drawing = true; var p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); hint.style.display = 'none'; }
function moveDraw(e) { if (!drawing) return; e.preventDefault(); var p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); sigEmpty = false; }
function endDraw() { drawing = false; }

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', moveDraw, { passive: false });
canvas.addEventListener('touchend', endDraw);

document.getElementById('btn-clear').addEventListener('click', function() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  sigEmpty = true;
  hint.style.display = '';
});

// ── Language switching ────────────────────────────────────────────────────
var currentLang = DEFAULT_LANG in T ? DEFAULT_LANG : 'ca';

function applyLang(lang) {
  var t = T[lang];
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;

  document.getElementById('hdr-title').textContent = t.hdr_title;
  document.getElementById('hdr-org').textContent = t.hdr_org;
  document.getElementById('sec-personal').textContent = t.sec_personal;
  document.getElementById('lbl-firstname').textContent = t.lbl_firstname;
  document.getElementById('lbl-lastname').textContent = t.lbl_lastname;
  document.getElementById('lbl-doc').textContent = t.lbl_doc;
  document.getElementById('lbl-dob').textContent = t.lbl_dob;
  document.getElementById('lbl-email').textContent = t.lbl_email;
  document.getElementById('lbl-place').textContent = t.lbl_place;
  document.getElementById('sec-consents').textContent = t.sec_consents;
  document.getElementById('lbl-required').textContent = t.lbl_required;
  document.getElementById('cat-basic-label').textContent = t.cat_basic_label;
  document.getElementById('cat-basic-desc').textContent = t.cat_basic_desc;
  document.getElementById('cat-legal-label').textContent = t.cat_legal_label;
  document.getElementById('cat-legal-desc').textContent = t.cat_legal_desc;
  document.getElementById('cat-identity-label').textContent = t.cat_identity_label;
  document.getElementById('cat-identity-desc').textContent = t.cat_identity_desc;
  document.getElementById('cat-health-label').textContent = t.cat_health_label;
  document.getElementById('cat-health-desc').textContent = t.cat_health_desc;
  document.getElementById('cat-economic-label').textContent = t.cat_economic_label;
  document.getElementById('cat-economic-desc').textContent = t.cat_economic_desc;
  document.getElementById('cat-risk-label').textContent = t.cat_risk_label;
  document.getElementById('cat-risk-desc').textContent = t.cat_risk_desc;
  document.getElementById('sec-signature').textContent = t.sec_signature;
  document.getElementById('sig-instruction').textContent = t.sig_instruction;
  document.getElementById('sig-hint').textContent = t.sig_hint;
  document.getElementById('btn-clear').textContent = t.btn_clear;
  document.getElementById('sec-legal').textContent = t.sec_legal;
  document.getElementById('legal-text').textContent = t.legal_text;
  document.getElementById('btn-submit').textContent = t.btn_submit;
  document.title = 'ACATHI — ' + t.hdr_title;

  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

document.getElementById('lang-bar').addEventListener('click', function(e) {
  if (e.target.dataset.lang) applyLang(e.target.dataset.lang);
});

// ── Submit ────────────────────────────────────────────────────────────────
document.getElementById('btn-submit').addEventListener('click', function() {
  var t = T[currentLang];
  var errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';

  var fn = document.getElementById('firstName').value.trim();
  var ln = document.getElementById('lastName').value.trim();
  if (!fn) { errEl.textContent = t.err_firstname; errEl.style.display = 'block'; document.getElementById('firstName').focus(); return; }
  if (!ln) { errEl.textContent = t.err_lastname; errEl.style.display = 'block'; document.getElementById('lastName').focus(); return; }
  if (!document.getElementById('cb-basic').checked) { errEl.textContent = t.err_basic; errEl.style.display = 'block'; return; }

  var sigData = sigEmpty ? null : canvas.toDataURL('image/png');

  var payload = {
    firstName: fn,
    lastName: ln,
    docNum: document.getElementById('docNum').value.trim(),
    dob: document.getElementById('dob').value,
    email: document.getElementById('email').value.trim(),
    consentDate: new Date().toISOString().slice(0, 10),
    consentPlace: document.getElementById('place').value.trim() || 'Barcelona',
    language: currentLang,
    signature: sigData,
    consents: {
      basic:    document.getElementById('cb-basic').checked,
      legal:    document.getElementById('cb-legal').checked,
      identity: document.getElementById('cb-identity').checked,
      health:   document.getElementById('cb-health').checked,
      economic: document.getElementById('cb-economic').checked,
      risk:     document.getElementById('cb-risk').checked,
    },
  };

  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = '…';

  fetch('/acathi/consent/' + TOKEN + '/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) {
      document.getElementById('form-container').style.display = 'none';
      var ss = document.getElementById('status-screen');
      document.getElementById('status-icon').textContent = t.ok_icon;
      document.getElementById('status-title').textContent = t.ok_title;
      document.getElementById('status-msg').textContent = t.ok_msg;
      ss.style.display = 'block';
    } else {
      errEl.textContent = data.error || t.err_server;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = t.btn_submit;
    }
  })
  .catch(function() {
    errEl.textContent = t.err_server;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = t.btn_submit;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
applyLang(currentLang);
</script>
